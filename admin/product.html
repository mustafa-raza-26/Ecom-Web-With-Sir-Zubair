<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/63fac70219.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation / Header -->
    <header class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm fixed-top">
        <div class="container-fluid">
            <button class="btn btn-outline-light d-md-none me-2" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a class="navbar-brand fw-bold" href="#">Admin Dashboard</a>

            <div class="d-flex align-items-center ms-auto">
                <div class="avatar overflow-hidden rounded-circle shadow-sm" style="width: 40px; height: 40px;">
                    <img src="https://thumbs.dreamstime.com/b/vector-icon-user-avatar-web-site-mobile-app-man-face-flat-style-social-network-profile-45836554.jpg" alt="avatar" class="w-100 h-100 object-fit-cover">
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid" style="margin-top: 70px;">
        <div class="row">

            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse shadow-sm p-3">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column gap-1">
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-dark" href="./dashboard.html"><i class="fa-solid fa-house me-2"></i>Home</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-dark" href="./order.html"><i class="fa-solid fa-bag-shopping me-2"></i>Orders</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 active bg-primary text-white" href="#"><i class="fa-solid fa-box me-2"></i>Products</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-dark" href="./customer.html"><i class="fa-solid fa-user-tie me-2"></i>Customer</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-dark" href="./setting.html"><i class="fa-solid fa-gear me-2"></i>Setting</a></li>
                        <hr class="my-2 text-muted">
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-danger fw-semibold" href="./index.html"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="table-container bg-white p-4 rounded-4 shadow-sm border border-opacity-10">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h4 fw-bold text-dark m-0">Our Product</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-uppercase fs-7">
                                <tr>
                                    <th class="py-3">Product Name</th>
                                    <th class="py-3">Image</th>
                                    <th class="py-3">Rating</th>
                                    <th class="py-3">Discount</th>
                                    <th class="py-3">Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="product-name">Zinger Burger</td>
                                    <td><img class="product-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFKlt3tKoWiEUQTTrQ7cz9lAj_q_mVXqoyZA&s" alt="Zinger Burger"></td>
                                    <td>
                                        <span class="rating" aria-label="3 out of 5 stars">
                                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i><i class="fa-regular fa-star"></i>
                                        </span>
                                    </td>
                                    <td><span class="discount-badge">20% Off</span></td>
                                    <td class="price">$20</td>
                                </tr>
                                <tr>
                                    <td class="product-name">Pizza</td>
                                    <td><img class="product-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdjbwPYDhTQBE0CgnQ8LWwXeAInq5nOllrbg&s" alt="Pizza"></td>
                                    <td>
                                        <span class="rating" aria-label="5 out of 5 stars">
                                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                                        </span>
                                    </td>
                                    <td><span class="discount-badge">25% Off</span></td>
                                    <td class="price">$30</td>
                                </tr>
                                <tr>
                                    <td class="product-name">Chicken BBQ</td>
                                    <td><img class="product-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbcOax9f1zVdpiQOWAY0XVfOO2BqQ_oBCd7g&s" alt="Chicken BBQ"></td>
                                    <td>
                                        <span class="rating" aria-label="5 out of 5 stars">
                                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                                        </span>
                                    </td>
                                    <td><span class="discount-badge">25% Off</span></td>
                                    <td class="price">$40</td>
                                </tr>
                                <tr>
                                    <td class="product-name">Hot Dog</td>
                                    <td><img class="product-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2SJ6P4b0Ahz3Kk4dGReLcW-WGPN_g3UI-JQ&s" alt="Hot Dog"></td>
                                    <td>
                                        <span class="rating" aria-label="4 out of 5 stars">
                                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i>
                                        </span>
                                    </td>
                                    <td><span class="discount-badge">10% Off</span></td>
                                    <td class="price">$10</td>
                                </tr>
                                <tr>
                                    <td class="product-name">Ice Cream</td>
                                    <td><img class="product-img" src="https://png.pngtree.com/png-vector/20240310/ourmid/pngtree-strawberry-ice-cream-cone-png-image_11925089.png" alt="Ice Cream"></td>
                                    <td>
                                        <span class="rating" aria-label="5 out of 5 stars">
                                            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                                        </span>
                                    </td>
                                    <td><span class="discount-badge">20% Off</span></td>
                                    <td class="price">$6</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
