<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/63fac70219.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation / Header -->
    <header class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm fixed-top">
        <div class="container-fluid">
            <button class="btn btn-outline-light d-md-none me-2" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a class="navbar-brand fw-bold" href="#">Admin Dashboard</a>

            <div class="d-flex align-items-center ms-auto">
                <div class="avatar overflow-hidden rounded-circle shadow-sm" style="width: 40px; height: 40px;">
                    <img src="https://thumbs.dreamstime.com/b/vector-icon-user-avatar-web-site-mobile-app-man-face-flat-style-social-network-profile-45836554.jpg" alt="avatar" class="w-100 h-100 object-fit-cover">
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid" style="margin-top: 70px;">
        <div class="row">

            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse shadow-sm p-3">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column gap-1">
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-dark" href="./dashboard.html"><i class="fa-solid fa-house me-2"></i>Home</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-dark" href="./order.html"><i class="fa-solid fa-bag-shopping me-2"></i>Orders</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-dark" href="./product.html"><i class="fa-solid fa-box me-2"></i>Products</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-dark" href="./customer.html"><i class="fa-solid fa-user-tie me-2"></i>Customer</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 active bg-primary text-white" href="#"><i class="fa-solid fa-gear me-2"></i>Setting</a></li>
                        <hr class="my-2 text-muted">
                        <li class="nav-item"><a class="nav-link rounded px-3 py-2 text-danger fw-semibold" href="./index.html"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

                <h1 class="h3 fw-bold mb-4">Website Setting</h1>

                <form>
                    <!-- Profile -->
                    <section class="settings-card">
                        <h2><i class="fa-solid fa-user-gear"></i>Profile Setting</h2>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="adminName" class="form-label">Admin Name</label>
                                <input type="text" id="adminName" class="form-control" placeholder="Admin Name">
                            </div>
                            <div class="col-md-6">
                                <label for="adminEmail" class="form-label">Admin Email</label>
                                <input type="email" id="adminEmail" class="form-control" placeholder="Admin Email">
                            </div>
                            <div class="col-md-6">
                                <label for="adminPhone" class="form-label">Number</label>
                                <input type="tel" id="adminPhone" class="form-control" placeholder="Number">
                            </div>
                            <div class="col-md-6">
                                <label for="adminLocation" class="form-label">Location</label>
                                <input type="text" id="adminLocation" class="form-control" placeholder="Location">
                            </div>
                        </div>
                    </section>

                    <!-- Website -->
                    <section class="settings-card">
                        <h2><i class="fa-solid fa-globe"></i>Website Setting</h2>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="siteColor" class="form-label">Website Color Code</label>
                                <input type="color" id="siteColor" class="form-control form-control-color w-100" value="#5b5ef4" title="Choose website color">
                            </div>
                            <div class="col-md-6">
                                <label for="siteUrl" class="form-label">Website URL</label>
                                <input type="url" id="siteUrl" class="form-control" placeholder="https://example.com">
                            </div>
                            <div class="col-md-6">
                                <label for="siteDesc" class="form-label">Description</label>
                                <input type="text" id="siteDesc" class="form-control" placeholder="Description">
                            </div>
                            <div class="col-md-6">
                                <label for="siteOwner" class="form-label">Owner</label>
                                <input type="text" id="siteOwner" class="form-control" placeholder="Owner">
                            </div>
                        </div>
                    </section>

                    <!-- Notifications -->
                    <section class="settings-card">
                        <h2><i class="fa-solid fa-bell"></i>Notification</h2>
                        <div class="form-check form-switch notify-item">
                            <input class="form-check-input" type="checkbox" role="switch" id="notifyEmail">
                            <label class="form-check-label" for="notifyEmail">Email Notification</label>
                        </div>
                        <div class="form-check form-switch notify-item">
                            <input class="form-check-input" type="checkbox" role="switch" id="notifySms">
                            <label class="form-check-label" for="notifySms">SMS Notification</label>
                        </div>
                        <div class="form-check form-switch notify-item">
                            <input class="form-check-input" type="checkbox" role="switch" id="notifyUpdate">
                            <label class="form-check-label" for="notifyUpdate">System Update</label>
                        </div>
                    </section>

                    <!-- Policies -->
                    <section class="settings-card">
                        <h2><i class="fa-solid fa-file-shield"></i>Terms &amp; Conditions, Privacy Policy</h2>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="policies" class="form-label">Policies</label>
                                <textarea id="policies" class="form-control" rows="5" placeholder="Enter your policies">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Illum, fugiat.</textarea>
                            </div>
                            <div class="col-md-6">
                                <label for="terms" class="form-label">Terms &amp; Conditions</label>
                                <textarea id="terms" class="form-control" rows="5" placeholder="Enter your terms">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Illum, fugiat.</textarea>
                            </div>
                        </div>
                    </section>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="save-btn"><i class="fa-solid fa-floppy-disk me-2"></i>Save Changes</button>
                    </div>
                </form>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
